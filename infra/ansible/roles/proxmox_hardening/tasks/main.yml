---
# Host-level hardening that Terraform can't express. 2FA enrollment (TOTP) for the Proxmox web UI
# is a manual per-user step (Datacenter > Permissions > Two Factor, or user's own "TFA" panel) —
# it requires scanning a QR code, so it isn't automated here. This role prints a reminder instead
# of silently skipping it.

- name: Disable SSH password login for root
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: "PermitRootLogin prohibit-password"
  when: disable_root_ssh_password_login
  notify: restart sshd

- name: Disable SSH password auth entirely (key-only)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: "PasswordAuthentication no"
  when: disable_root_ssh_password_login
  notify: restart sshd

- name: Ensure datacenter-wide Proxmox firewall is enabled
  ansible.builtin.command:
    cmd: pvesh set /cluster/firewall/options --enable 1
  changed_when: true
  when: enable_pve_firewall

- name: Remind operator that 2FA enrollment is a manual step
  ansible.builtin.debug:
    msg: >-
      MANUAL STEP REQUIRED: enable TOTP two-factor auth for your Proxmox admin user via
      Datacenter > Permissions > Two Factor (or the user's own TFA panel). This cannot be
      automated because it requires scanning a QR code during enrollment.
