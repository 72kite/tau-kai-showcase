# Helm values for grafana/loki (monolithic single-binary deployment mode - sufficient for
# home-lab log volume; avoids the microservices/simple-scalable deployment complexity).
# Install with:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install loki grafana/loki -n observability -f loki-values.yaml
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi

# Chart-managed extras not needed for a single-binary home deployment.
gateway:
  enabled: false
minio:
  enabled: false
