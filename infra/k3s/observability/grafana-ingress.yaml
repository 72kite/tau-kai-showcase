# kube-prometheus-stack names its Grafana Service "<release-name>-grafana"; this assumes the
# release was installed as `helm upgrade --install kube-prometheus-stack ...` per
# kube-prometheus-stack-values.yaml's comment. Adjust serviceName if you used a different
# release name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - grafana.tau.lan
      secretName: grafana-tls
  rules:
    - host: grafana.tau.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
