apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-models
  namespace: voice
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
  namespace: voice
spec:
  selector:
    app: whisper
  ports:
    - name: http
      port: 8000
      targetPort: 8000
