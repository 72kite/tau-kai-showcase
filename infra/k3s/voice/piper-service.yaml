apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piper-models
  namespace: voice
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: piper
  namespace: voice
spec:
  selector:
    app: piper
  ports:
    - name: wyoming
      port: 10200
      targetPort: 10200
