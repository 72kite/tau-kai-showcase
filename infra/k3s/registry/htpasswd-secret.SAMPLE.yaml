# Shows the shape of the Secret the registry needs. Generate a real htpasswd file with:
#   htpasswd -Bbn <user> <password> > htpasswd
# then:
#   kubectl -n registry create secret generic registry-htpasswd --from-file=htpasswd=htpasswd
# Do not copy this file to htpasswd-secret.yaml and fill in the base64 by hand for real
# credentials — use `kubectl create secret` as above so nothing plaintext ever touches disk
# under this directory. This file is committed only to document the expected Secret shape.
apiVersion: v1
kind: Secret
metadata:
  name: registry-htpasswd
  namespace: registry
type: Opaque
data:
  htpasswd: UkVQTEFDRV9NRQ== # base64 of an htpasswd file; placeholder value, do not use
