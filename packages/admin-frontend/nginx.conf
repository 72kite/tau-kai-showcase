# Single-origin serving for the Tau admin panel, same reasoning as packages/frontend/nginx.conf:
# one origin means plain http on the LAN and https behind a reverse proxy both work with no CORS
# and no mixed content. Built with VITE_ADMIN_API_BASE="" (the Dockerfile default) so its fetches
# are relative.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    location ~ ^/(api/|login$|logout$|me$|change-password$|health$) {
        set $tau_admin http://tau-admin-server:8100;
        proxy_pass $tau_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
