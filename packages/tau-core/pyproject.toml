[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tau-core"
version = "0.1.0"
description = "Tau Core - the MCP Host orchestrator for Project Tau"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6.0,<2.0.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "anyio>=4.4",
  # Imported directly by llm/models.py to give the Ollama provider a real timeout. It arrives
  # transitively via the openai client too, but a module that imports it should declare it.
  "httpx>=0.27",
  "pydantic-ai-slim[openai]>=0.2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pypdf>=4.0",
  # Phase 10: encryption-at-rest for the approval queue (crypto_store.py).
  "argon2-cffi>=23.1",
  "cryptography>=42",
  # Phase 27.D Milestone 3: mDNS advertisement so the desktop client can discover tau-core's TLS
  # listener instead of a human typing an IP (tau_core/discovery.py). Off by default
  # (TauCoreSettings.tls_enabled) - no effect on existing plain-HTTP-only deployments.
  "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tau_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
