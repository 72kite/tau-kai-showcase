[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-mcp-server"
version = "0.1.0"
description = "Robotics MCP server for Project Tau — outdoor drone patrol (robot dog deferred)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0,<2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
