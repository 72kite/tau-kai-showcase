# Single-origin serving for the Tau UI (deployment: DEPLOYMENT.md §5c).
#
# The frontend and tau-core used to be two origins (:3000 and :8000), which forced CORS and — worse
# — broke behind a single HTTPS hostname (a Tailscale serve / reverse proxy): the page loads over
# https:// but its API calls to http://host:8000 are mixed-content and blocked, so voice/chat die.
#
# Here nginx serves the SPA AND proxies every /api/ call to tau-core, so the browser only ever makes
# SAME-ORIGIN requests. The frontend is built with VITE_TAU_API_BASE="" (the Dockerfile default), so
# its fetches are relative ("/api/..."). One origin => works over plain http on the LAN, and over
# https on the tailnet, with no CORS and no mixed content.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so `tau-core` is re-resolved per request - the proxy survives a
    # tau-core restart without nginx needing a reload (nginx otherwise pins the upstream IP at
    # startup and 502s forever once the container's IP changes).
    resolver 127.0.0.11 valid=10s;

    # API passthrough. A variable upstream (with the resolver above) defers DNS to request time;
    # no URI on proxy_pass means the full original path is forwarded verbatim, so /api/state ->
    # tau-core:8000/api/state (tau-core's own routes already live under /api).
    location /api/ {
        set $tau_core http://tau-core:8000;
        proxy_pass $tau_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat turns can take many seconds; don't buffer or time out the response early.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA: hand back the requested asset if it exists, else index.html (single-page app).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
