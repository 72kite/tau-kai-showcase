[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-mcp-server"
version = "0.1.0"
description = "Face/voice embedding + person-profile MCP server for Project Tau (Phase 2)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6.0,<2.0.0",
  "chromadb>=0.5",
  "python-dotenv>=1.0",
  # Phase 10: encryption-at-rest for the profile store (crypto_store.py).
  "argon2-cffi>=23.1",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
