[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia-mcp-server"
version = "0.1.0"
description = "Wikipedia MCP server for Project Tau: offline-first encyclopedia lookups via a self-hosted Kiwix server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
