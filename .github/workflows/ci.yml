# Manual-only on this snapshot.
#
# This repo is a point-in-time export, and its CDG ruleset is a 5-rule illustrative subset of the
# real 53-rule one. The full CI asserts rules that exist only in the real ruleset (cdg-integrity's
# promote_memory -> REQUIRE_APPROVAL, and test_cdg.py's every-tool-has-a-rule test), so on push it
# could never pass here. Its npm audit / pip-audit steps also fail on new advisories by design, so
# a green badge on an unmaintained snapshot would rot to red on its own. The real CI runs in the
# private development repo.

name: CI

on:
  workflow_dispatch:

jobs:
  snapshot-notice:
    name: Snapshot notice
    runs-on: ubuntu-latest
    steps:
      - run: echo "Snapshot export - CI runs in the private development repo."
